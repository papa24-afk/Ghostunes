<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghosttunes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cinzel:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700;800&family=Kalam:wght@700&family=Manrope:wght@500;600;700&family=Oswald:wght@600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#050505] text-white font-['Inter',sans-serif] antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script>
      // Immediate OAuth Popup callback handler for Spotify & Deezer
      if (window.location.pathname.includes('spotify-callback')) {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        const state = params.get('state');
        if (window.opener) {
          window.opener.postMessage({ type: 'SPOTIFY_AUTH_CALLBACK', code, error, state }, window.location.origin);
          window.close();
        } else {
          sessionStorage.setItem('ghosttunes_oauth_callback', JSON.stringify({ provider: 'spotify', code, error, state }));
          window.location.href = '/';
        }
      } else if (window.location.pathname.includes('deezer-callback')) {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error_reason') || params.get('error');
        const state = params.get('state');
        if (window.opener) {
          window.opener.postMessage({ type: 'DEEZER_AUTH_CALLBACK', code, error, state }, window.location.origin);
          window.close();
        } else {
          sessionStorage.setItem('ghosttunes_oauth_callback', JSON.stringify({ provider: 'deezer', code, error, state }));
          window.location.href = '/';
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
