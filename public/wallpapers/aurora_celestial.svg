<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020813" />
      <stop offset="60%" stop-color="#06152d" />
      <stop offset="100%" stop-color="#020610" />
    </linearGradient>

    <linearGradient id="auroraBand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="30%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="auroraBand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="40%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <filter id="auroraBlur">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#auroraSky)" />

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="150" cy="90" r="1.5" opacity="0.8" />
    <circle cx="380" cy="180" r="1.2" opacity="0.6" />
    <circle cx="620" cy="70" r="2" opacity="0.9" />
    <circle cx="890" cy="140" r="1" opacity="0.5" />
    <circle cx="1150" cy="80" r="1.8" opacity="0.85" />
    <circle cx="1400" cy="200" r="1.4" opacity="0.7" />
    <circle cx="1680" cy="110" r="2.2" opacity="0.9" />
    <circle cx="1820" cy="230" r="1.2" opacity="0.5" />
    <circle cx="280" cy="350" r="1.5" opacity="0.6" />
    <circle cx="750" cy="290" r="1.8" opacity="0.7" />
    <circle cx="1220" cy="380" r="1.2" opacity="0.5" />
    <circle cx="1590" cy="320" r="1.6" opacity="0.8" />
  </g>

  <!-- Aurora Ribbon 1 -->
  <path d="M 0 350 Q 480 180 960 380 T 1920 280 L 1920 600 Q 1440 680 960 520 T 0 580 Z" fill="url(#auroraBand1)" filter="url(#auroraBlur)" />

  <!-- Aurora Ribbon 2 -->
  <path d="M 0 420 Q 520 580 1020 320 T 1920 460 L 1920 720 Q 1380 580 880 700 T 0 650 Z" fill="url(#auroraBand2)" filter="url(#auroraBlur)" />

  <!-- Mountain Silhouette Base -->
  <path d="M 0 950 L 220 860 L 480 930 L 750 820 L 1020 910 L 1350 790 L 1640 880 L 1920 810 L 1920 1080 L 0 1080 Z" fill="#01040a" />
</svg>
