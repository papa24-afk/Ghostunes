name: Release Ghosttunes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.4)'
        required: true
        default: 'v1.0.4'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Package Windows Installer
        run: npx electron-builder --win nsis --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/Ghosttunes-Setup-*.exe
            release/Ghosttunes-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 7

  build-mac:
    name: Build macOS DMG & ZIP
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Generate macOS ICNS icon
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16     build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64     build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_512x512.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
          rm -rf build/icon.iconset

      - name: Package macOS DMG & ZIP
        run: npx electron-builder --mac dmg zip --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish Multi-Platform GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: release-assets

      - name: List Release Assets
        run: ls -la release-assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Ghosttunes ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎵 Ghosttunes Multi-Platform Release

            #### 🍏 macOS Installation Note (Gatekeeper Bypass)
            If macOS displays: *"Ghosttunes.app is damaged and can't be opened. You should move it to the Bin"* — the app is **not** damaged. This is Apple Gatekeeper blocking unsigned apps downloaded via web browsers.

            **Quick 5-Second Fix:**
            1. Drag **Ghosttunes.app** into your **Applications** folder from the DMG window.
            2. Open **Terminal** (press `⌘ + Space`, type `Terminal`, hit Enter).
            3. Run this single command:
               ```bash
               xattr -cr /Applications/Ghosttunes.app
               ```
            4. Launch Ghosttunes from Applications. It opens immediately!

            *Alternative (no Terminal):* Open **System Settings** > **Privacy & Security** > scroll to **Security** > click **Open Anyway**.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
